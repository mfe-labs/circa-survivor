name: Update Circa results

on:
  schedule:
    # every 3 hours, every day. The old Thu-Mon window left no run between Monday 21:41 UTC and Tuesday
    # 15:41, which is exactly when Monday Night Football finishes, so the last result of a week sat
    # unrecorded for half a day. The job exits in seconds when there is nothing new.
    - cron: "41 */3 * * *"
    # Saturday evening Pacific, when Circa posts the Selections PDF (their card is tweeted 6:18-6:22 pm PT, so the
    # PDF is up by about 6). Cron is UTC, so these are Sunday UTC: 6:01, 6:17, 7:01, 7:17, 8:01 pm PDT, which also
    # cover 5:01-7:01 pm PST once the clocks change in November. The job exits in seconds when nothing is new.
    - cron: "1 1 * * 0"
    - cron: "17 1 * * 0"
    - cron: "1 2 * * 0"
    - cron: "17 2 * * 0"
    - cron: "1 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: npm ci
      - name: Picks from Circa's Selections PDF, results from ESPN
        run: node scripts/fetch-actuals.mjs
      - name: Freeze future value for any week that just locked
        run: npm run freeze-fv
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # picks.json can also be written by the app, so on a raced push do not replay a stale copy:
          # reset to main and recompute, which reads whatever is actually there now.
          for i in 1 2 3; do
            git add data/actuals.json data/picks.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "Update Circa results"
            if git push -q origin HEAD:main; then gh workflow run deploy.yml; exit 0; fi
            echo "push raced with another run, recomputing on top of main ($i)"
            git fetch -q origin main && git reset -q --hard origin/main
            node scripts/fetch-actuals.mjs && npm run freeze-fv
          done
          echo "could not push after 3 attempts"; exit 1
