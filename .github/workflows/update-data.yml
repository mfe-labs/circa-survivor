name: Update lines & ratings

on:
  schedule:
    - cron: "17 14,23 * * *"   # twice a day, ~10:17 AM and 7:17 PM Eastern; off the hour because GitHub drops on-the-hour crons under load
    - cron: "17 20 * * 6"      # plus Saturday 1:17 pm PT (12:17 pm PST from November), three hours before Circa's lock instead of nine
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull moneylines & spreads (The Odds API)
        run: node scripts/fetch-odds.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      - name: Fit power ratings from market spreads
        run: node scripts/fit-ratings.mjs
      - name: Commit and redeploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These two files are regenerated from scratch every run, so the newest generation simply wins.
          # Rebasing onto a concurrent run's commit conflicted on every line; replaying our files on top
          # of whatever is on main cannot conflict.
          mkdir -p "$RUNNER_TEMP/out" && cp data/odds.json data/ratings.json "$RUNNER_TEMP/out/"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/out/"*.json data/
            git add data/odds.json data/ratings.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -q -m "Update lines & ratings"
            if git push -q origin HEAD:main; then gh workflow run deploy.yml; exit 0; fi
            echo "push raced with another run, retrying ($i)"; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
